apiVersion: apps/v1
kind: Deployment
metadata:
  name: isvara
  namespace: isvara
  labels:
    app: isvara
spec:
  replicas: 1
  selector:
    matchLabels:
      app: isvara
  template:
    metadata:
      labels:
        app: isvara            # must match spec.selector
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: isvara
          # CI rewrites this tag to the commit SHA on every build
          image: ghcr.io/janicehan1985/isvara:2026-08-06-v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: isvara-env   # created in Step 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
